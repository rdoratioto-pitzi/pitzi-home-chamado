name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build --config vite.config.ts
        env:
          VITE_API_BASE_URL: ${{ github.ref == 'refs/heads/main' && vars.VITE_API_URL || vars.VITE_API_URL_DEV }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name ${{ github.ref == 'refs/heads/main' && 'renov-home' || 'renov-home-dev' }} --commit-dirty=true
