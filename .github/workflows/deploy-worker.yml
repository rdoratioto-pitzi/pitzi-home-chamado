name: Deploy Worker to Cloudflare

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install worker dependencies
        run: cd worker && npm ci

      - name: Generate version
        id: version
        run: echo "APP_VERSION=$(TZ=America/Sao_Paulo date +%Y.%m.%d-%H.%M)-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Migrations versionadas ANTES do deploy: o código novo só sobe com o schema pronto.
      # Se uma migration falhar, o deploy não acontece.
      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/develop' && secrets.DATABASE_URL_DEV || secrets.DATABASE_URL }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy ${{ github.ref == 'refs/heads/develop' && '-e dev' || '' }} --var APP_VERSION:${{ steps.version.outputs.APP_VERSION }}
