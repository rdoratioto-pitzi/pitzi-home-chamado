name: Deploy Worker to Cloudflare

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install worker dependencies
        run: cd worker && npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy ${{ github.ref == 'refs/heads/develop' && '-e dev' || '' }}

      - name: Run database migrations
        run: |
          sudo apt-get install -y -qq expect > /dev/null 2>&1
          expect -c '
            set timeout 120
            spawn npx drizzle-kit push --force
            expect {
              "created or renamed" { send "\r"; exp_continue }
              eof
            }
          '
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/develop' && secrets.DATABASE_URL_DEV || secrets.DATABASE_URL }}
