name: Auto PR develop → main

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or skip PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq 'length')
          if [ "$EXISTING" -gt "0" ]; then
            echo "✅ PR develop→main já existe. Nada a fazer."
            exit 0
          fi
          gh pr create \
            --base main \
            --head develop \
            --title "🚀 Deploy: develop → main" \
            --body "Merge automático de develop para main.

          Aprovar este PR dispara deploy automático no Cloudflare Workers.

          ---
          _PR criado automaticamente pelo GitHub Actions_"
          echo "✅ PR criado com sucesso."
