name: Auto PR develop → main

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create or skip PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "✅ PR #$PR_NUMBER already open (develop → main). Skipping."
          else
            gh pr create \
              --base main \
              --head develop \
              --title "🚀 Deploy: develop → main" \
              --body "Merge automático de develop para main.

          Aprovar este PR para disparar o deploy automático no Cloudflare Workers + Pages.

          ---
          _PR criado automaticamente pelo GitHub Actions_" \
              --label "deploy"
            echo "✅ PR created (develop → main)."
          fi
