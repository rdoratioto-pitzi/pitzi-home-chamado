name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - develop
      - gh-pages

permissions:
  contents: read

jobs:
  test:
    name: Testes, migrations e build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install worker dependencies
        run: cd worker && npm ci --ignore-scripts

      # Banco descartável: schema atual + migrations versionadas por cima,
      # como acontece em produção (as migrations precisam aplicar sem erro).
      - name: Prepare database
        run: |
          npx drizzle-kit push --force
          npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Tests
        run: npm test

      - name: Build frontend
        run: npx vite build

      - name: Bundle worker (dry-run)
        run: cd worker && npx wrangler deploy --dry-run --outdir /tmp/worker-bundle
