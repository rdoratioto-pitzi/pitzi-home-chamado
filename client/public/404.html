<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pitzi Home</title>
  <script>
    // SPA redirect: when GitHub Pages returns 404 for a deep path,
    // redirect to index.html preserving the path via sessionStorage.
    var base = '/pitzi-home-chamado';
    var path = window.location.pathname.slice(base.length) || '/';
    sessionStorage.setItem('__spa_redirect', path + window.location.search + window.location.hash);
    window.location.replace(base + '/');
  </script>
</head>
</html>
