<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca de Prompts - Pitzi Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      color: #00A137;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .description {
      color: #666;
      margin-bottom: 20px;
    }
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 16px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: #00A137;
      color: #00A137;
    }
    .filter-btn.active {
      background: #00A137;
      color: white;
      border-color: #00A137;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .icon {
      width: 40px;
      height: 40px;
      background: rgba(0, 161, 55, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00A137;
      font-size: 20px;
    }
    .category-badge {
      background: #f0f0f0;
      color: #666;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-top: 4px;
    }
    .card-description {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .copy-btn {
      width: 100%;
      padding: 10px;
      background: #00A137;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background: #008f2f;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    .error {
      text-align: center;
      padding: 40px;
      color: #dc3545;
    }
    .search-box {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: 'Montserrat', sans-serif;
      margin-bottom: 20px;
    }
    .search-box:focus {
      outline: none;
      border-color: #00A137;
    }
    .stats {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      color: #666;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .stat-value {
      color: #00A137;
      font-size: 24px;
      font-weight: 600;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1000;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Biblioteca de Prompts</h1>
    <p class="description">Prompts prontos para usar com Claude Code. Organizados por categoria para facilitar seu desenvolvimento.</p>

    <div class="stats" id="stats"></div>

    <input type="text" class="search-box" id="search" placeholder="Buscar prompts...">

    <div class="filters" id="filters"></div>

    <div id="loading" class="loading">Carregando prompts...</div>
    <div id="error" class="error" style="display: none;"></div>
    <div id="grid" class="grid" style="display: none;"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const gridEl = document.getElementById('grid');
    const filtersEl = document.getElementById('filters');
    const searchEl = document.getElementById('search');
    const statsEl = document.getElementById('stats');
    const toastEl = document.getElementById('toast');

    let allPrompts = [];
    let selectedCategory = null;

    const categoryLabels = {
      "development-team": "Equipe de Desenvolvimento",
      "development-tools": "Ferramentas",
      "programming-languages": "Linguagens",
      "database": "Banco de Dados"
    };

    const categoryIcons = {
      "development-team": "🤖",
      "development-tools": "🔧",
      "programming-languages": "💻",
      "database": "🗄️"
    };

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    async function loadPrompts() {
      try {
        // Tenta carregar da API autenticada
        let response = await fetch('/api/prompts');
        
        if (response.status === 401) {
          // Se não autenticado, usa dados de demonstração
          errorEl.style.display = 'block';
          errorEl.innerHTML = `
            <h3 style="margin-bottom: 10px;">⚠️ Faça login para ver os prompts</h3>
            <p>Você precisa estar logado para acessar a biblioteca de prompts.</p>
            <p style="margin-top: 10px;">
              <a href="/login" style="color: #00A137; font-weight: 600;">Clique aqui para fazer login →</a>
            </p>
          `;
          loadingEl.style.display = 'none';
          return;
        }
        
        if (!response.ok) throw new Error('Falha ao carregar prompts');
        allPrompts = await response.json();
        
        loadingEl.style.display = 'none';
        gridEl.style.display = 'grid';
        
        renderStats();
        renderFilters();
        renderPrompts();
      } catch (error) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = 'Erro: ' + error.message;
      }
    }

    function renderStats() {
      const categoryCount = {};
      allPrompts.forEach(p => {
        categoryCount[p.category] = (categoryCount[p.category] || 0) + 1;
      });

      statsEl.innerHTML = `
        <div class="stat-item">
          <span class="stat-label">Total</span>
          <span class="stat-value">${allPrompts.length}</span>
        </div>
        ${Object.entries(categoryCount).map(([cat, count]) => `
          <div class="stat-item">
            <span class="stat-label">${categoryLabels[cat]}</span>
            <span class="stat-value">${count}</span>
          </div>
        `).join('')}
      `;
    }

    function renderFilters() {
      const categories = [...new Set(allPrompts.map(p => p.category))];
      
      filtersEl.innerHTML = `
        <button class="filter-btn ${selectedCategory === null ? 'active' : ''}" onclick="filterByCategory(null)">
          Todas (${allPrompts.length})
        </button>
        ${categories.map(cat => `
          <button class="filter-btn ${selectedCategory === cat ? 'active' : ''}" onclick="filterByCategory('${cat}')">
            ${categoryIcons[cat]} ${categoryLabels[cat]}
          </button>
        `).join('')}
      `;
    }

    function renderPrompts() {
      const searchTerm = searchEl.value.toLowerCase();
      let filtered = allPrompts;

      if (selectedCategory) {
        filtered = filtered.filter(p => p.category === selectedCategory);
      }

      if (searchTerm) {
        filtered = filtered.filter(p => 
          p.title.toLowerCase().includes(searchTerm) ||
          p.description.toLowerCase().includes(searchTerm)
        );
      }

      gridEl.innerHTML = filtered.map(prompt => `
        <div class="card">
          <div class="card-header">
            <div class="icon">${categoryIcons[prompt.category]}</div>
            <div>
              <span class="category-badge">${categoryLabels[prompt.category]}</span>
              <h3 class="card-title">${prompt.title}</h3>
            </div>
          </div>
          <p class="card-description">${prompt.description}</p>
          <button class="copy-btn" onclick="copyPrompt(\`${prompt.content.replace(/`/g, '\\`')}\`, '${prompt.title}')">
            📋 Copiar Prompt
          </button>
        </div>
      `).join('');
    }

    window.filterByCategory = function(category) {
      selectedCategory = category;
      renderFilters();
      renderPrompts();
    };

    window.copyPrompt = async function(content, title) {
      try {
        await navigator.clipboard.writeText(content);
        showToast(`✅ Prompt "${title}" copiado!`);
      } catch (error) {
        showToast('❌ Erro ao copiar prompt');
      }
    };

    searchEl.addEventListener('input', renderPrompts);

    loadPrompts();
  </script>
</body>
</html>
