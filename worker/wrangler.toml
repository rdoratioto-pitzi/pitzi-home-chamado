account_id = "def20b63679ab729ae63aeb53fe6979c"
name = "pitzi-home-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# A cada 5 minutos: fila de e-mails (novas tentativas). As automações "X dias aguardando
# o solicitante" rodam só na execução do início de cada hora (worker/src/index.ts).
[triggers]
crons = ["*/5 * * * *"]

[placement]
mode = "smart"

[vars]
APP_URL = "https://rdoratioto-pitzi.github.io/pitzi-home-chamado"
CORS_ORIGIN = "https://rdoratioto-pitzi.github.io"
API_URL = "https://pitzi-home-api.rodrigo-doratioto.workers.dev"
SENDPULSE_FROM_EMAIL = "noreply@pitzi.com.br"
SENDPULSE_FROM_NAME = "Pitzi Home"
# Caixa que envia os e-mails dos chamados (docs/emails-gmail-setup.md). As credenciais da conta
# de serviço são segredos: GOOGLE_SA_CLIENT_EMAIL e GOOGLE_SA_PRIVATE_KEY.
GMAIL_SENDER = "chamados@pitzi.com.br"
# Login com Google (docs/login-google-setup.md). O client id não é segredo; enquanto estiver
# vazio, o login por senha continua valendo para todos. Com ele preenchido, o login é só Google.
GOOGLE_LOGIN_CLIENT_ID = "735853432192-pmigofs93lea54cl1hf435dc3of3plaf.apps.googleusercontent.com"
ALLOWED_GOOGLE_DOMAINS = "pitzi.com.br"
# Chave de emergência: "true" volta a aceitar senha, só para administradores.
PASSWORD_LOGIN_ENABLED = "false"

[env.dev]
name = "pitzi-home-api-dev"

[env.dev.vars]
APP_URL = "http://localhost:5050"
CORS_ORIGIN = "http://localhost:5050"
API_URL = "http://localhost:8787"
SENDPULSE_FROM_EMAIL = "noreply@pitzi.com.br"
SENDPULSE_FROM_NAME = "Pitzi Home (Dev)"
GOOGLE_LOGIN_CLIENT_ID = ""
ALLOWED_GOOGLE_DOMAINS = "pitzi.com.br"
PASSWORD_LOGIN_ENABLED = "false"
