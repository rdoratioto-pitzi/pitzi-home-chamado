# Cloudflare Pages configuration for Pitzi Home frontend
# Deploy with: npx wrangler pages deploy dist/public --project-name pitzi-home
# Or use the wrangler.pages.toml config below for `wrangler pages dev`

name = "pitzi-home"
pages_build_output_dir = "dist/public"
compatibility_date = "2025-09-01"

# Environment variables are set in the Cloudflare Pages dashboard
# VITE_API_URL — the Worker API base URL (e.g., https://pitzi-home-api.pitzi.workers.dev)

[env.production]
name = "pitzi-home"

[env.preview]
name = "pitzi-home"
